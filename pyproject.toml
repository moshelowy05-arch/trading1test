[project]
name = "pmarb"
version = "0.1.0"
description = "Prediction-market arbitrage research and execution platform (Kalshi / Polymarket)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.7",
    "cryptography>=43",
    "rich>=13.7",
]

[project.optional-dependencies]
# Only needed if Polymarket live execution is ever enabled (it is disabled by default and
# geographically unavailable to US persons on the international venue).
polymarket-live = ["py-clob-client>=0.20"]
# Statistical research phase only (docs/superpowers/specs/2026-09-30-statistical-research-calibration-design.md).
# Never needed by the live pipeline: install with `uv sync --extra research`.
research = ["numpy>=2.0"]

[project.scripts]
pmarb = "pmarb.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmarb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: tests that hit real public venue APIs (deselect with -m 'not network')",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM", "PL"]
ignore = ["PLR0913", "PLR0917", "PLC0415", "PLW2901", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
mypy_path = "src"
packages = ["pmarb"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
ignore_missing_imports = true
